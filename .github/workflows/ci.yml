name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run markercodex --db data/markercodex.duckdb init
      - run: uv run markercodex --db data/markercodex.duckdb export
      - run: uv run markercodex --db data/markercodex.duckdb build-site
